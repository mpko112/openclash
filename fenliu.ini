[custom]
; ==========================================================
; 方案 A · 四地区修正版（HK / TH / KR / VN）
; - 保留原配置完整应用分流结构
; - 国家节点仅保留：香港 / 泰国 / 韩国 / 越南
; - 删除 TW / JP / SG / US 与“冷门节点”
; - 手动选择 / 自动选择 也只允许四地区节点
; - Adobe 提供 REJECT（可禁止联网）
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Expire|Official|Website

; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
; 屏蔽 Adobe 给足权限排最上。
; 如 OpenClash 开启“绕过大陆”，国内可访问的 Adobe 域名/IP 可能绕过内核直连，
; 可在“流量控制 → 绕过指定区域 IPv4 黑名单”中补充：
; adobe.com
; adobelogin.com
; adobe.io
; behance.net

ruleset=🟥 Adobe,[]GEOSITE,adobe
ruleset=🟥 Adobe,[]GEOIP,adobe,no-resolve

; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Aethersailor 直连补丁 ---
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- Aethersailor 代理补丁（仅兜底用，不越权）---
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- 国内直连 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 国内可用 / 下载 / BT ---
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; ------------请在下方区域内添加应用---------------
; --- 核心应用 ---
ruleset=📦 Notion,[]GEOSITE,Notion
ruleset=📦 Notion,[]GEOIP,Notion,no-resolve

ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=📨 Telegram,[]GEOIP,telegram,no-resolve

ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve

; --- 海外主流应用补充 ---
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=🎵 TikTok,[]GEOIP,tiktok,no-resolve
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

; --- 开发 / 工具 ---
ruleset=🛠 GitHub,[]GEOSITE,github
ruleset=🛠 GitHub,[]GEOIP,github,no-resolve
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam

; --- 交易所 & Adobe（全部走 GEOSITE）---
ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟪 Bybit,[]GEOSITE,bybit

; ==========================================================
; --- 若使用上方 geo 没有匹配到，可以改用 URL 规则，需先删除对应应用的 ruleset ---
; --- ruleset=🟦 OKX,clash-domain:https://xxx/okx.yaml,86400
; ==========================================================
; ------------请在上方区域内添加应用---------------

; --- 社交 / 通讯 ---
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn

; --- Google / Microsoft / Cloudflare ---
ruleset=☁️ cloudflare,[]GEOSITE,cloudflare
ruleset=☁️ cloudflare,[]GEOIP,cloudflare,no-resolve

ruleset=🔎 Google,[]GEOSITE,google
ruleset=🔎 Google,[]GEOIP,google,no-resolve

ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=🪟 Microsoft,[]GEOIP,microsoft,no-resolve

; --- GFW 兜底 ---
ruleset=🚀 手动选择,[]GEOSITE,gfw

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; 2) 应用分流策略组
;    每个应用仅可选 HK / TH / KR / VN + 必要的 DIRECT / Default
; ==========================================================
; ------------请在下方区域内添加应用---------------

custom_proxy_group=📦 Notion`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]DIRECT`[]🌐 Default
custom_proxy_group=🍎 Apple`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]DIRECT`[]🌐 Default
custom_proxy_group=🤖 ChatGPT`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default
custom_proxy_group=🧠 AI`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default
custom_proxy_group=📨 Telegram`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default
custom_proxy_group=📞 即时通讯`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default
custom_proxy_group=💬 社交媒体`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default

custom_proxy_group=🎬 YouTube`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default
custom_proxy_group=🎥 Netflix`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default

custom_proxy_group=🎵 TikTok`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default
custom_proxy_group=📸 Instagram`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default
custom_proxy_group=🐦 X`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default

custom_proxy_group=🛠 GitHub`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]🧭 手动选择`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default

custom_proxy_group=🟦 OKX`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]DIRECT`[]🌐 Default
custom_proxy_group=🟨 Binance`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]DIRECT`[]🌐 Default
custom_proxy_group=🟪 Bybit`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]DIRECT`[]🌐 Default

; ------------请在上方区域内添加---------------

; Adobe：允许一键禁止联网
custom_proxy_group=🟥 Adobe`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]DIRECT`[]REJECT`[]🌐 Default

custom_proxy_group=🔎 Google`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default
custom_proxy_group=☁️ cloudflare`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default

; Microsoft：允许直连优先
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🌐 Default

; ==========================================================
; 3) Default / 漏网之鱼
;    全部限制在四地区节点范围
; ==========================================================

; 兜底“手动选择”
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]🧭 手动选择`[]DIRECT

; Default 出口
custom_proxy_group=🌐 Default`select`[]🇭🇰 HK`[]🇹🇭 TH`[]🇰🇷 KR`[]🇻🇳 VN`[]♻️ 自动选择`[]🧭 手动选择`[]DIRECT

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🧭 手动选择`[]🚀 手动选择

; ==========================================================
; 4) 非标端口
; ==========================================================
custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]DIRECT
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼

; ==========================================================
; 5) 国家节点测速组（仅 HK / TH / KR / VN）
; ==========================================================

; 四地区节点统一匹配
; HK: 香港 / HK / HKG / Hong Kong
; TH: 泰国 / TH / BKK / Thailand / Bangkok
; KR: 韩国 / 韓國 / KR / KOR / Korea / Seoul
; VN: 越南 / VN / Vietnam / Hanoi / HCM / HCMC / Ho Chi Minh / Saigon

; 手动选择：只显示这四地区节点
custom_proxy_group=🧭 手动选择`select`(?i)(🇭🇰|香港|\bHK\b|\bHKG\b|hong\s*kong|🇹🇭|泰国|泰國|\bTH\b|\bBKK\b|thailand|bangkok|🇰🇷|韩国|韓國|\bKR\b|\bKOR\b|korea|seoul|🇻🇳|越南|\bVN\b|vietnam|hanoi|\bHCM\b|\bHCMC\b|ho\s*chi\s*minh|saigon)

; 自动选择：只在这四地区节点中测速
custom_proxy_group=♻️ 自动选择`url-test`(?i)(🇭🇰|香港|\bHK\b|\bHKG\b|hong\s*kong|🇹🇭|泰国|泰國|\bTH\b|\bBKK\b|thailand|bangkok|🇰🇷|韩国|韓國|\bKR\b|\bKOR\b|korea|seoul|🇻🇳|越南|\bVN\b|vietnam|hanoi|\bHCM\b|\bHCMC\b|ho\s*chi\s*minh|saigon)`https://www.gstatic.com/generate_204`300,,50

; 香港
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|\bHK\b|\bHKG\b|hong\s*kong)`http://www.gstatic.com/generate_204`300,,50

; 泰国
custom_proxy_group=🇹🇭 TH`url-test`(?i)(🇹🇭|泰国|泰國|\bTH\b|\bBKK\b|thailand|bangkok)`http://www.gstatic.com/generate_204`300,,50

; 韩国
custom_proxy_group=🇰🇷 KR`url-test`(?i)(🇰🇷|韩国|韓國|\bKR\b|\bKOR\b|korea|seoul)`http://www.gstatic.com/generate_204`300,,50

; 越南
custom_proxy_group=🇻🇳 VN`url-test`(?i)(🇻🇳|越南|\bVN\b|vietnam|hanoi|\bHCM\b|\bHCMC\b|ho\s*chi\s*minh|saigon)`http://www.gstatic.com/generate_204`300,,50
